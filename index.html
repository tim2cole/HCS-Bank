<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny Money Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F0F3EC;
    --paper-raised:#FFFFFF;
    --ink:#182420;
    --ink-soft:#4B5951;
    --line:#D9DECF;
    --bank:#1F6F54;
    --bank-dark:#154D3A;
    --bank-tint:#E4F0E9;
    --gold:#C98F2A;
    --gold-tint:#FBF0DA;
    --red:#B14436;
    --red-tint:#F8E7E3;
    --navy:#1B2A41;
    --navy-2:#26385291;
    --radius-card:18px;
    --radius-btn:10px;
    --shadow: 0 1px 0 rgba(24,36,32,0.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  #root{display:flex;min-height:100vh;}
  ::selection{background:var(--bank-tint);}

  /* ---------- NAV ---------- */
  .rail{
    width:220px;flex-shrink:0;background:var(--navy);color:#EDEFE8;
    display:flex;flex-direction:column;padding:20px 14px;gap:2px;
  }
  .rail .brand{
    padding:6px 8px 22px 8px;
  }
  .rail .brand .mark{font-size:20px;line-height:1.15;font-weight:600;color:#fff;}
  .rail .brand .sub{font-size:11.5px;color:#9FB0A8;margin-top:3px;}
  .navbtn{
    display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:9px;
    color:#C9D3CB;background:transparent;border:none;text-align:left;font-size:14px;
    font-family:'Inter',sans-serif;cursor:pointer;transition:background .12s ease,color .12s ease;
  }
  .navbtn svg{flex-shrink:0;opacity:.85;}
  .navbtn:hover{background:#25384F;color:#fff;}
  .navbtn.active{background:var(--bank);color:#fff;}
  .navbtn.active svg{opacity:1;}
  .rail .spacer{flex:1;}
  .rail .foot{font-size:11px;color:#7C8C84;padding:10px 8px 2px;border-top:1px solid #2A3B52;margin-top:6px;}

  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1180px;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .topbar .titles h1{font-size:26px;margin:0 0 4px;font-weight:600;}
  .topbar .titles p{margin:0;color:var(--ink-soft);font-size:14px;}
  .stat-strip{display:flex;gap:22px;}
  .stat{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px;}
  .stat .n{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;color:var(--bank-dark);}
  .stat .l{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-card);padding:22px;box-shadow:var(--shadow);}
  .card + .card{margin-top:18px;}

  button{font-family:'Inter',sans-serif;}
  .btn{
    border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);
    padding:9px 16px;border-radius:var(--radius-btn);font-size:14px;font-weight:600;cursor:pointer;
    transition:transform .05s ease, border-color .12s ease;
  }
  .btn:hover{border-color:var(--bank);}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--bank);border-color:var(--bank);color:#fff;}
  .btn.primary:hover{background:var(--bank-dark);}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
  .btn.danger:hover{background:#8f3529;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn.ghost:hover{color:var(--ink);border-color:var(--line);}
  .btn.block{width:100%;}
  .btn.lg{padding:16px 20px;font-size:15px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  .grid-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:900px){.grid-actions{grid-template-columns:repeat(2,1fr);}}
  .action-tile{
    display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px 16px;
    border:1px solid var(--line);border-radius:14px;background:var(--paper-raised);cursor:pointer;
    text-align:left;transition:border-color .12s ease, background .12s ease;
  }
  .action-tile:hover{border-color:var(--bank);background:var(--bank-tint);}
  .action-tile .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bank-tint);color:var(--bank-dark);}
  .action-tile .t{font-weight:600;font-size:14.5px;}
  .action-tile .d{font-size:12px;color:var(--ink-soft);}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line);}
  td{padding:11px 10px;border-bottom:1px solid #EAEDE2;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;}
  .amt-pos{color:var(--bank-dark);font-weight:600;}
  .amt-neg{color:var(--red);font-weight:600;}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;}
  .pill.reward{background:var(--bank-tint);color:var(--bank-dark);}
  .pill.fine{background:var(--red-tint);color:var(--red);}
  .pill.purchase{background:var(--gold-tint);color:var(--gold);}
  .pill.reversal{background:#EFEFEF;color:#666;}
  .pill.payment{background:var(--bank-tint);color:var(--bank-dark);}

  input,select,textarea{
    font-family:'Inter',sans-serif;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
    font-size:14px;background:#fff;color:var(--ink);width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--bank);outline-offset:1px;border-color:var(--bank);}
  label.field{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
  .field-row{margin-bottom:14px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .searchbox{position:relative;}
  .search-results{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden;background:#fff;}
  .search-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;border-bottom:1px solid #EEF1E7;}
  .search-row:last-child{border-bottom:none;}
  .search-row:hover{background:var(--bank-tint);}
  .search-row .name{font-weight:600;font-size:14px;}
  .search-row .sub{font-size:12px;color:var(--ink-soft);}
  .search-row .bal{font-family:'IBM Plex Mono',monospace;font-weight:600;}

  /* physical card */
  .fm-card{
    width:320px;aspect-ratio:1.586/1;border-radius:16px;background:linear-gradient(135deg,#1B2A41,#233A57);
    color:#fff;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;
    box-shadow:0 10px 24px rgba(20,30,45,0.28);position:relative;overflow:hidden;
  }
  .fm-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%);}
  .fm-card .bank-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;letter-spacing:.2px;}
  .fm-card .chip{width:34px;height:26px;border-radius:5px;background:linear-gradient(135deg,#D9A441,#F3D890);}
  .fm-card .qr{width:44px;height:44px;background:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;}
  .fm-card .qr img,.fm-card .qr svg{width:36px;height:36px;}
  .fm-card .holder{font-size:15px;font-weight:600;}
  .fm-card .acct{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#B9C4D6;margin-top:2px;letter-spacing:.5px;}
  .fm-card.inactive{filter:grayscale(1);opacity:.55;}
  .fm-card .row{display:flex;justify-content:space-between;align-items:flex-start;}

  .balance-hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .balance-hero .num{font-family:'Fraunces',serif;font-size:52px;font-weight:600;color:var(--bank-dark);line-height:1;transition:opacity .18s ease;}
  .balance-hero .lbl{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .status-dot.on{background:var(--bank);}
  .status-dot.off{background:#B9B9B9;}

  .quick-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}

  .preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media (max-width:760px){.preset-grid{grid-template-columns:repeat(2,1fr);}}
  .preset{
    border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;text-align:left;
  }
  .preset:hover{border-color:var(--bank);}
  .preset.selected{border-color:var(--bank);background:var(--bank-tint);}
  .preset .pt{font-weight:600;font-size:13.5px;}
  .preset .pa{font-family:'IBM Plex Mono',monospace;margin-top:4px;font-size:14px;}
  .preset.reward .pa{color:var(--bank-dark);}
  .preset.fine .pa{color:var(--red);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;
    box-shadow:0 8px 22px rgba(0,0,0,.22);z-index:50;display:flex;align-items:center;gap:10px;
    animation:toastin .18s ease;
  }
  .toast.err{background:var(--red);}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}

  .empty{padding:34px 10px;text-align:center;color:var(--ink-soft);}
  .empty .big{font-size:32px;margin-bottom:8px;}

  .modal-bg{position:fixed;inset:0;background:rgba(22,32,28,.45);display:flex;align-items:center;justify-content:center;z-index:60;}
  .modal{background:#fff;border-radius:16px;padding:26px;width:380px;max-width:92vw;}
  .modal h3{margin:0 0 6px;}
  .modal p{color:var(--ink-soft);font-size:14px;margin:0 0 18px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;}

  .section-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .section-h h2{font-size:17px;margin:0;font-weight:600;}
  .section-h .hint{font-size:12.5px;color:var(--ink-soft);}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .tab{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--bank-dark);border-color:var(--bank);}

  .kiosk-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh;}
  .kiosk{width:420px;max-width:92vw;background:#fff;border-radius:22px;padding:30px;box-shadow:0 16px 40px rgba(20,30,25,.15);text-align:center;}

  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:9px 6px;border-bottom:1px solid #EEF1E7;}
  .checkbox-row:last-child{border-bottom:none;}

  .badge-inactive{font-size:11px;background:#EFEFEF;color:#777;padding:2px 8px;border-radius:99px;}
  .badge-active{font-size:11px;background:var(--bank-tint);color:var(--bank-dark);padding:2px 8px;border-radius:99px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================= ICONS ============================= */
const ICONS = {
  home: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>`,
  scan: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>`,
  reward: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M8.2 12.5 7 21l5-2.5L17 21l-1.2-8.5"/></svg>`,
  fine: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>`,
  store: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9 5 4h14l1 5"/><path d="M4 9h16v10H4z"/><path d="M9 13a3 3 0 0 0 6 0"/></svg>`,
  payment: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M2.5 20c.7-3.2 3-5 6.5-5s5.8 1.8 6.5 5"/><path d="M14.5 15.3c2.7.4 4.3 2 4.9 4.7"/></svg>`,
  students: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1-4 3.5-6 7-6s6 2 7 6"/></svg>`,
  history: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>`,
  reports: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>`,
  kiosk: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="12" rx="1.5"/><path d="M9 20h6M12 15v5"/></svg>`,
  back: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M14 18 7 11l7-7"/></svg>`,
};
function qr(seed){
  // deterministic pseudo-qr pattern purely decorative, generated from the card id
  let h = 0; for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  let rnd = ()=>{ h = (h*1103515245+12345) >>> 0; return (h>>>16) % 2; };
  let cells='';
  for(let y=0;y<7;y++) for(let x=0;x<7;x++){
    if((x<2&&y<2)||(x>4&&y<2)||(x<2&&y>4)) continue; // leave corners for finder marks
    if(rnd()) cells += `<rect x="${x*5}" y="${y*5}" width="4.4" height="4.4"/>`;
  }
  const finder = (fx,fy)=>`<rect x="${fx}" y="${fy}" width="9" height="9" fill="none" stroke="#111" stroke-width="2"/><rect x="${fx+3}" y="${fy+3}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 35 35" xmlns="http://www.w3.org/2000/svg" fill="#111">${cells}${finder(0,0)}${finder(26,0)}${finder(0,26)}</svg>`;
}

/* ============================= FIREBASE ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyB6iz_MOrkUSWS3Sz6NKP-Ys8RkwAvVSgw",
  authDomain: "hcs-bank.firebaseapp.com",
  projectId: "hcs-bank",
  storageBucket: "hcs-bank.firebasestorage.app",
  messagingSenderId: "851840007523",
  appId: "1:851840007523:web:3404fd1fc95db161c7a756",
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
// Everyone in the class shares this single document. Change 'classState' if you
// ever want a second, independent bank (e.g. one per class period).
const stateDocRef = doc(db, 'funnymoney', 'classState');

/* ============================= STATE ============================= */
let state = null;
let view = {name:'dashboard'};
let toastTimer = null;
const urlParams = new URLSearchParams(location.search);
const KIOSK_MODE = urlParams.get('kiosk') === '1'; // bookmark ?kiosk=1 on the classroom kiosk device
let unlocked = false; // resets on page reload/close \u2014 in-memory only, no browser storage used

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function cardId(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='FMC-'; for(let i=0;i<8;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function acctId(n){ return 'FM-' + String(1000+n); }

function seedState(){
  const students = [
    {id:'st1', acct:'FM-1041', name:'Jordan M.', classPeriod:'Period 3', active:true, cardId:'FMC-K7P92X4Q', cardActive:true},
    {id:'st2', acct:'FM-1042', name:'Ava R.', classPeriod:'Period 3', active:true, cardId:'FMC-J2M84LWT', cardActive:true},
    {id:'st3', acct:'FM-1043', name:'Deshawn T.', classPeriod:'Period 3', active:true, cardId:'FMC-Q9X31CRP', cardActive:true},
    {id:'st4', acct:'FM-1044', name:'Priya S.', classPeriod:'Period 3', active:true, cardId:'FMC-7VBN45KD', cardActive:true},
    {id:'st5', acct:'FM-1045', name:'Miles O.', classPeriod:'Period 3', active:true, cardId:'FMC-2LPX98QY', cardActive:true},
  ];
  const now = Date.now();
  const day = 86400000;
  const transactions = [
    {id:'TX-00001', studentId:'st1', type:'reward', amount:250, description:'Excellent participation', ts: now-3*day, by:'Ms. Alvarez'},
    {id:'TX-00002', studentId:'st1', type:'purchase', amount:-10, description:'Pencil', ts: now-2*day, by:'Ms. Alvarez'},
    {id:'TX-00003', studentId:'st1', type:'reward', amount:20, description:'Homework completed', ts: now-2*day, by:'Ms. Alvarez'},
    {id:'TX-00004', studentId:'st1', type:'reward', amount:125, description:'Weekly bonus', ts: now-1*day, by:'Ms. Alvarez'},
    {id:'TX-00005', studentId:'st2', type:'reward', amount:150, description:'On-task behavior', ts: now-2*day, by:'Ms. Alvarez'},
    {id:'TX-00006', studentId:'st2', type:'fine', amount:-10, description:'Late assignment', ts: now-1*day, by:'Ms. Alvarez'},
    {id:'TX-00007', studentId:'st3', type:'reward', amount:200, description:'Above-and-beyond effort', ts: now-4*day, by:'Ms. Alvarez'},
    {id:'TX-00008', studentId:'st4', type:'reward', amount:100, description:'Prepared for class', ts: now-3*day, by:'Ms. Alvarez'},
    {id:'TX-00009', studentId:'st5', type:'reward', amount:75, description:'Helping another student', ts: now-2*day, by:'Ms. Alvarez'},
  ];
  return {
    classPeriod:'Period 3',
    teacherName:'Ms. Alvarez',
    students, transactions,
    products:[
      {id:'p1', name:'Pencil', price:10, inventory:40},
      {id:'p2', name:'Homework pass', price:150, inventory:5},
      {id:'p3', name:'Choose your seat', price:100, inventory:null},
      {id:'p4', name:'Snack', price:75, inventory:18},
      {id:'p5', name:'Music privilege', price:125, inventory:null},
      {id:'p6', name:'Mystery prize', price:200, inventory:8},
    ],
    rewardPresets:[
      {name:'On-task behavior', amount:5},
      {name:'Prepared for class', amount:10},
      {name:'Homework completed', amount:20},
      {name:'Helping another student', amount:10},
      {name:'Excellent participation', amount:15},
      {name:'Above-and-beyond effort', amount:25},
      {name:'Weekly bonus', amount:50},
    ],
    finePresets:[
      {name:'Missing pencil', amount:5},
      {name:'Late assignment', amount:10},
      {name:'Classroom rule violation', amount:20},
      {name:'Replacement material', amount:25},
    ],
    settings:{ allowNegativeFromFines:true, teacherPin:'1234' },
    nextTx: 10,
    nextAcct: 1046,
  };
}

async function saveState(){
  try{ await setDoc(stateDocRef, { json: JSON.stringify(state) }); }
  catch(e){ console.error('save failed', e); toast('Could not save \u2014 check your internet connection.', true); }
}
function setView(v){ view = v; render(); }

/* ============================= DERIVED ============================= */
function txForStudent(id){ return state.transactions.filter(t=>t.studentId===id).sort((a,b)=>b.ts-a.ts); }
function balanceOf(id){ return state.transactions.filter(t=>t.studentId===id).reduce((s,t)=>s+t.amount,0); }
function studentById(id){ return state.students.find(s=>s.id===id); }
function moneyIssuedToday(){
  const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
  return state.transactions.filter(t=>t.ts>=startOfDay.getTime() && t.amount>0).reduce((s,t)=>s+t.amount,0);
}
function txCountToday(){
  const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
  return state.transactions.filter(t=>t.ts>=startOfDay.getTime()).length;
}
function fmt$(n){ const neg = n<0; const v = Math.abs(n); return (neg?'-':'') + '$' + v.toLocaleString(); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtDateTime(ts){ return new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }

function addTransaction(studentId, type, amount, description, relatedId){
  state.nextTx += 1;
  const tx = {
    id:'TX-'+String(state.nextTx).padStart(5,'0'),
    studentId, type, amount, description,
    ts: Date.now(), by: state.teacherName,
    relatedTransactionId: relatedId || null,
  };
  state.transactions.push(tx);
  return tx;
}

/* ============================= TOAST ============================= */
function toast(msg, isErr){
  clearTimeout(toastTimer);
  const old = document.querySelector('.toast'); if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(()=>el.remove(), 2600);
}

function rowWithRunningBalance(t, studentId){
  // running balance = sum of all tx for student up to and including this one

  for(const x of all){ running += x.amount; if(x.id===t.id){ after = running; } }
  return `<tr>
    <td style="color:var(--ink-soft);">${fmtDate(t.ts)}</td>
    <td><span class="pill ${t.type}">${labelType(t.type)}</span></td>
    <td>${t.description}</td>
    <td class="num mono ${t.amount>=0?'amt-pos':'amt-neg'}">${fmt$(t.amount)}</td>
    <td class="num mono">${fmt$(after)}</td>
  </tr>`;
}

          <input id="raAmount" type="number" min="0" step="1" placeholder="0">

        ${isReward?'Give reward':'Issue fine'}
      </button>
    </div>
  `;

let raSelectedStudent = null;
function onRaSearch(v, kind){
  const box = document.getElementById('raResults');
  if(!v.trim()){ box.style.display='none'; return; }
  const matches = state.students.filter(s=>s.active && s.name.toLowerCase().includes(v.toLowerCase()));
  box.style.display='block';
  box.innerHTML = matches.length ? matches.map(s=>`<div class="search-row" onclick="pickRaStudent('${s.id}','${kind}')">
      <div><div class="name">${s.name}</div><div class="sub">${s.acct}</div></div><div class="bal">${fmt$(balanceOf(s.id))}</div>
    </div>`).join('') : `<div class="empty" style="padding:14px;">No matches.</div>`;
}
function pickRaStudent(id, kind){ setView({name:kind, studentId:id}); }
function pickPreset(idx, kind){
  document.querySelectorAll('#presetGrid .preset').forEach(el=>el.classList.remove('selected'));
  const el = document.querySelector(`#presetGrid .preset[data-idx="${idx}"]`);
  if(el) el.classList.add('selected');
  const presets = kind==='reward' ? state.rewardPresets : state.finePresets;
  if(idx==='custom'){
    document.getElementById('raDesc').value='';
    document.getElementById('raAmount').value='';
    document.getElementById('raDesc').focus();
  }else{
    const p = presets[idx];
    document.getElementById('raDesc').value = p.name;
    document.getElementById('raAmount').value = p.amount;
  }
}
function submitRewardFine(kind){
  const s = studentById(view.studentId);
  if(!s){ toast('Choose a student first.', true); return; }
  const desc = document.getElementById('raDesc').value.trim();
  const amt = parseFloat(document.getElementById('raAmount').value);
  if(!desc){ toast('Add a short description.', true); return; }
  if(!amt || amt<=0){ toast('Enter an amount greater than 0.', true); return; }
  const signed = kind==='reward' ? Math.round(amt) : -Math.round(amt);
  if(kind==='fine' && !state.settings.allowNegativeFromFines){
    const projected = balanceOf(s.id) + signed;
    if(projected < 0){ toast(`That would take ${s.name} below $0. Fines can't do that with the current setting.`, true); return; }
  }
  addTransaction(s.id, kind, signed, desc);
  saveState();
  toast(`${kind==='reward'?'Reward':'Fine'} recorded for ${s.name}: ${fmt$(signed)}`);
  setView({name:'student', studentId:s.id});
}

function viewStorePurchase(studentId){
  const s = studentId ? studentById(studentId) : null;
  const bal = s ? balanceOf(s.id) : 0;
  return `
    <div class="topbar"><div class="titles">
      <button class="btn ghost" onclick="setView({name:'${s?'student':'select'}'${s?`, studentId:'${s.id}'`:''}})" style="margin-bottom:8px;padding-left:4px;">${ICONS.back} Back</button>
      <h1>Class store</h1>
      <p>${s ? `Shopping for ${s.name} &middot; balance ${fmt$(bal)}` : 'Select a student to start checkout.'}</p>
    </div></div>
    ${!s ? `<div class="card"><div class="empty">Scan or search for a student first, then come back to the store.<br><button class="btn primary" style="margin-top:12px;" onclick="setView({name:'select'})">Find a student</button></div></div>` : `
    <div class="card">
      <table><thead><tr><th>Item</th><th class="num">Price</th><th class="num">In stock</th><th></th></tr></thead><tbody>
        ${state.products.map(p=>{
          const outOfStock = p.inventory!==null && p.inventory<=0;
          const cantAfford = bal < p.price;
          const disabled = outOfStock || cantAfford;
          return `<tr>
            <td>${p.name}</td>
            <td class="num mono">${fmt$(p.price)}</td>
            <td class="num">${p.inventory===null?'&mdash;':p.inventory}</td>
            <td class="num"><button class="btn ${disabled?'':'primary'}" ${disabled?'disabled':''} onclick="buyItem('${s.id}','${p.id}')">${outOfStock?'Sold out':cantAfford?'Insufficient funds':'Buy'}</button></td>
          </tr>`;
        }).join('')}
      </tbody></table>
    </div>`}
  `;
}
function buyItem(studentId, productId){
  const s = studentById(studentId), p = state.products.find(x=>x.id===productId);
  if(!s || !p) return;
  const bal = balanceOf(studentId);
  if(p.inventory!==null && p.inventory<=0){ toast('That item is sold out.', true); return; }
  if(bal < p.price){ toast(`Declined \u2014 insufficient Funny Money. ${s.name} has ${fmt$(bal)}, item costs ${fmt$(p.price)}.`, true); return; }
  addTransaction(studentId, 'purchase', -p.price, p.name);
  if(p.inventory!==null) p.inventory -= 1;
  saveState();
  toast(`Approved \u2014 ${s.name} bought ${p.name}. New balance: ${fmt$(balanceOf(studentId))}`);
  render();
}

  const p = id ? state.products.find(x=>x.id===id) : null;

function saveProduct(id){

    const p = state.products.find(x=>x.id===id);
    p.name=name; p.price=Math.round(price); p.inventory=inventory;

    state.products.push({id:uid('p'), name, price:Math.round(price), inventory});

function deleteProduct(id){
  state.products = state.products.filter(p=>p.id!==id);
  saveState(); closeModal(); render(); toast('Item removed.');
}

function loadStudentImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ document.getElementById('studentImportText').value = String(reader.result || ''); };
  reader.onerror = ()=>toast('Could not read that file.', true);
  reader.readAsText(file);
}

function parseStudentImport(text){
  const lines = text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const rows = [];
  for(let i=0;i<lines.length;i++){
    let line = lines[i];
    let parts;
    if(line.includes('\t')) parts = line.split('\t');
    else {
      // Basic CSV parsing, including quoted names such as "Smith, Jordan".
      const matches = [...line.matchAll(/(?:^|,)\s*(?:"((?:[^"]|"")*)"|([^,]*))/g)];
      parts = matches.map(m=>(m[1]!==undefined ? m[1].replace(/""/g,'"') : m[2]).trim());
    }
    parts = parts.filter((p,idx)=>idx<2 || p.trim()!=='');
    const name = (parts[0] || '').trim();
    const cls = (parts[1] || state.classPeriod).trim() || state.classPeriod;
    if(!name) continue;
    if(i===0 && /^(student\s*)?name$/i.test(name) && (!parts[1] || /class|period/i.test(parts[1]))) continue;
    rows.push({name, classPeriod:cls});
  }
  return rows;
}

function importStudents(){
  const raw = document.getElementById('studentImportText').value;
  const rows = parseStudentImport(raw);
  if(!rows.length){ toast('Paste or choose a student list first.', true); return; }

  const existing = new Set(state.students.map(s=>`${s.name.trim().toLowerCase()}|${s.classPeriod.trim().toLowerCase()}`));
  let added = 0, skipped = 0;
  for(const row of rows){
    const key = `${row.name.toLowerCase()}|${row.classPeriod.toLowerCase()}`;
    if(existing.has(key)){ skipped++; continue; }
    state.students.push({
      id:uid('st'), acct:acctId(state.nextAcct), name:row.name, classPeriod:row.classPeriod,
      active:true, cardId:cardId(), cardActive:true
    });
    state.nextAcct += 1;
    existing.add(key);
    added++;
  }

  if(!added){ toast(`No students imported — ${skipped} duplicate${skipped===1?' was':'s were'} skipped.`, true); return; }
  saveState(); closeModal(); render();
  toast(`Imported ${added} student${added===1?'':'s'}${skipped ? `; skipped ${skipped} duplicate${skipped===1?'':'s'}` : ''}.`);
}

function saveStudent(id){
  const name = document.getElementById('mSName').value.trim();
  const cls = document.getElementById('mSClass').value.trim() || state.classPeriod;
  if(!name){ toast('Enter a name.', true); return; }
  if(id){
    const s = studentById(id); s.name=name; s.classPeriod=cls;
  }else{
    const s = {id:uid('st'), acct:acctId(state.nextAcct), name, classPeriod:cls, active:true, cardId:cardId(), cardActive:true};
    state.nextAcct += 1;
    state.students.push(s);
  }
  saveState(); closeModal(); render(); toast('Saved.');
}
function deactivateCard(id){
  const s = studentById(id); s.cardActive=false;

function reissueCard(id){

}
function toggleActive(id){
  const s = studentById(id); s.active = !s.active;

function confirmDeleteStudent(id){
  const s = studentById(id);

  showModal(`

    <p>This removes the account, card, and all ${txCount} transaction record${txCount===1?'':'s'} for good. There's no audit trail left behind and this can't be undone. If you might need the history later, use Deactivate instead.</p>

function confirmReverse(txId){
  const t = state.transactions.find(x=>x.id===txId);
  const st = studentById(t.studentId);
  showModal(`
    <h3>Reverse this transaction?</h3>
    <p>${labelType(t.type)} of ${fmt$(t.amount)} for ${st.name} (${t.description}). This creates a new offsetting transaction &mdash; the original stays in the record.</p>
    <div class="actions">

      <button class="btn danger" onclick="doReverse('${txId}')">Reverse transaction</button>
    </div>

function doReverse(txId){
  const t = state.transactions.find(x=>x.id===txId);
  addTransaction(t.studentId, 'reversal', -t.amount, `Reversal of ${t.id}`, t.id);
  saveState(); closeModal(); render();
  toast(`Reversed ${t.id}.`);
}
function exportCSV(){
  const header = 'transaction_id,student,type,amount,description,date,created_by\\n';
  const rows = [...state.transactions].sort((a,b)=>a.ts-b.ts).map(t=>{
    const st = studentById(t.studentId);
    return [t.id, st?st.name:'', t.type, t.amount, `"${t.description.replace(/"/g,'""')}"`, new Date(t.ts).toISOString(), t.by].join(',');
  }).join('\\n');
  const blob = new Blob([header+rows], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='funny-money-transactions.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('CSV downloaded.');
}
